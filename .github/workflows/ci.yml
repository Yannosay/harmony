name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-windows

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: build/HarmonyTests_artefacts/Release/HarmonyTests.exe Harmony

      - uses: actions/upload-artifact@v4
        with:
          name: harmony-windows-x64
          path: build/Harmony_artefacts/Release/Harmony.exe
          retention-days: 14

  linux:
    name: Linux x64 (portability)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-linux

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: xvfb-run -a build/HarmonyTests_artefacts/Release/HarmonyTests Harmony
